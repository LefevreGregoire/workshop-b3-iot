<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inter-Vessel Security Center</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div>
        <h1>Inter-Vessel Security Center</h1>
        <p>Autonomous Intrusion Detection & Response</p>
    </div>

    <div class="system-status">
        <span class="status-dot online"></span>
        SYSTEM ONLINE
    </div>
</header>


<main>

    <!-- ========================================================= -->
    <!-- Overview                                                  -->
    <!-- ========================================================= -->

    <section class="overview">

        <div class="stat-card">
            <span class="stat-title">Devices</span>
            <strong id="device-count">0</strong>
        </div>

        <div class="stat-card">
            <span class="stat-title">Online</span>
            <strong id="online-count">0</strong>
        </div>

        <div class="stat-card warning">
            <span class="stat-title">Warnings</span>
            <strong id="warning-count">0</strong>
        </div>

        <div class="stat-card critical">
            <span class="stat-title">Critical</span>
            <strong id="critical-count">0</strong>
        </div>

    </section>


    <!-- ========================================================= -->
    <!-- Devices                                                   -->
    <!-- ========================================================= -->

    <section>

        <div class="section-header">
            <h2>Vessels</h2>
        </div>

        <div id="devices-container" class="devices-grid">
            <!-- Devices generated by JavaScript -->
        </div>

    </section>


    <!-- ========================================================= -->
    <!-- Critical incidents                                        -->
    <!-- ========================================================= -->

    <section>

        <div class="section-header">
            <h2>Critical Incidents</h2>

            <span id="critical-indicator" class="badge critical-badge">
                0 unresolved
            </span>
        </div>

        <div id="critical-container" class="incident-list">
            <!-- Critical incidents generated by JavaScript -->
        </div>

    </section>


    <!-- ========================================================= -->
    <!-- Logs                                                       -->
    <!-- ========================================================= -->

    <section>

        <div class="section-header">
            <h2>Logs</h2>
        </div>

        <div class="filters">

            <label>
                Severity

                <select id="severity-filter">
                    <option value="ALL">All</option>
                    <option value="INFO">INFO</option>
                    <option value="WARN">WARN</option>
                    <option value="CRITICAL">CRITICAL</option>
                </select>
            </label>


            <label>
                Device

                <select id="device-filter">
                    <option value="ALL">All devices</option>
                </select>
            </label>


            <label>
                Type

                <select id="type-filter">
                    <option value="ALL">All types</option>
                </select>
            </label>

        </div>


        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Device</th>
                        <th>Severity</th>
                        <th>Type</th>
                        <th>Message</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="logs-container">
                    <!-- Logs generated by JavaScript -->
                </tbody>

            </table>

        </div>

    </section>

</main>


<footer>
    Inter-Vessel Security Infrastructure — MVP
</footer>


<script src="app.js"></script>

</body>
</html>
