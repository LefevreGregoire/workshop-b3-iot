name: Inter-Vessel IDS CI/CD
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
jobs:
  test-python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m compileall py/

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            python -m unittest discover -s tests -v
          else
            echo "No tests directory found - skipping tests."
          fi

  docker-build:

    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - test-python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f Docker/Dockerfile \
            -t inter-vessel-ids:ci .

      - name: Test Docker image
        run: |
          docker run --rm inter-vessel-ids:ci