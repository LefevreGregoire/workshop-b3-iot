# docker-compose.yml
# Orchestration complète de l'IDS inter-vaisseau :
#   - mosquitto : bus de messages MQTT pour la communication device <-> center
#   - ids-web   : API, dashboard, MQTT consumer, IDS and first-response
#
# Lancer depuis la racine du projet :
#   docker compose -f docker/docker-compose.yml up -d --build

services:

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: ids-mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "1883:1883"          # exposé pour que les devices (autres Raspberry Pi) publient dessus
    networks:
      - ids-net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  ids-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: ids-web
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: "ids/devices/+/events"
      IDS_RESPONSE_MODE: "${IDS_RESPONSE_MODE:-observe}"
      IDS_DRY_RUN: "${IDS_DRY_RUN:-1}"
    volumes:
      - ../logs:/app/logs:ro
      - ../config:/app/config:ro
    ports:
      - "5000:5000"
    networks:
      - ids-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/status')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  ids-net:
    driver: bridge

volumes:
  mosquitto-data:
