# Configuration minimale du broker mosquitto pour le réseau inter-vaisseau.
# MQTT est choisi ici pour la communication device -> center car il est
# léger, low-bandwidth et adapté aux liaisons instables (cohérent avec
# l'objectif "communication optimisée, rapide" du projet).

listener 1883
protocol mqtt

# Persistance locale des messages retenus (utile si le Center Device redémarre)
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# NOTE sécurité : en production, activer TLS (listener 8883 + certificate)
# et l'authentification (password_file) plutôt que l'accès anonyme ci-dessous,
# qui n'est acceptable que pour la simulation/dev en réseau isolé.
allow_anonymous true
